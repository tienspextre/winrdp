name: Release Ubuntu .deb

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro_tag: ubuntu24.04
            runs_on: ubuntu-24.04
            container: ""
          - distro_tag: ubuntu26.04
            runs_on: ubuntu-24.04
            container: ubuntu:26.04

    runs-on: ${{ matrix.runs_on }}
    container: ${{ matrix.container }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies (${{ matrix.distro_tag }})
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          SUDO=""
          if command -v sudo >/dev/null 2>&1; then SUDO="sudo"; fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            ca-certificates build-essential cmake ninja-build pkg-config git ccache \
            libgtk-4-dev libadwaita-1-dev libsecret-1-dev libepoxy-dev libgl-dev \
            libssl-dev libx11-dev libxext-dev libxinerama-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxrandr-dev libxkbfile-dev libxdamage-dev \
            libxv-dev libxrender-dev libwayland-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev libcups2-dev libfuse3-dev libusb-1.0-0-dev \
            libkrb5-dev libicu-dev libcjson-dev libjson-c-dev libjpeg-turbo8-dev \
            libcairo2-dev libopus-dev liburiparser-dev libpkcs11-helper1-dev \
            libpcsclite-dev libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev libva-dev libdrm-dev \
            desktop-file-utils dpkg-dev binutils file

      - name: Restore cached FreeRDP 3.33.1 (${{ matrix.distro_tag }})
        id: cache-freerdp3
        uses: actions/cache@v4
        with:
          path: third_party/freerdp3-install
          key: freerdp3-3.33.1-${{ matrix.distro_tag }}-${{ hashFiles('scripts/build-freerdp3.sh') }}

      - name: Build bundled FreeRDP 3.33.1 (H.264 + VA-API)
        run: |
          if [ ! -f third_party/freerdp3-install/lib/pkgconfig/freerdp3.pc ]; then
            ./scripts/build-freerdp3.sh
          fi

      - name: Build WinRDP and run unit tests
        run: ./scripts/build-app.sh

      - name: Build .deb package (${{ matrix.distro_tag }})
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            PKG_VERSION="${GITHUB_REF_NAME#v}"
          else
            PKG_VERSION="$(sed -nE 's/^[[:space:]]*project\(winrdp[[:space:]]+VERSION[[:space:]]+([^[:space:])]+).*/\1/p' CMakeLists.txt | head -n 1)"
          fi
          ./scripts/build-deb.sh --version "$PKG_VERSION" --distro-tag "${{ matrix.distro_tag }}"

      - name: Verify .deb metadata, linkage, and extracted binary
        run: |
          DEB_FILE="$(ls -1 dist/*.deb | head -n 1)"
          dpkg-deb --info "$DEB_FILE"
          dpkg-deb --contents "$DEB_FILE"

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          dpkg-deb -x "$DEB_FILE" "$TMP_DIR"

          if ldd "$TMP_DIR/usr/bin/winrdp" | grep -q 'not found'; then
            echo "ERROR: Missing shared library in extracted binary" >&2
            ldd "$TMP_DIR/usr/bin/winrdp"
            exit 1
          fi
          BUNDLE_DIR_REAL="$(realpath -m "$TMP_DIR/usr/lib/winrdp/lib")"
          for libname in libfreerdp3.so.3 libfreerdp-client3.so.3 libwinpr3.so.3; do
            resolved="$(ldd "$TMP_DIR/usr/bin/winrdp" | awk -v l="$libname" '$1 == l {print $3}')"
            resolved_real="$(realpath -m "$resolved")"
            if [[ "$resolved_real" != "$BUNDLE_DIR_REAL/"* ]]; then
              echo "ERROR: $libname did not resolve to bundled dir: $resolved ($resolved_real)" >&2
              exit 1
            fi
          done

          desktop-file-validate "$TMP_DIR/usr/share/applications/io.winrdp.Client.desktop"
          VER_OUT="$(cd /tmp && "$TMP_DIR/usr/bin/winrdp" --version)"
          echo "$VER_OUT"
          if [[ "$VER_OUT" != *"H264/HWAccel=ON"* ]]; then
            echo "ERROR: Expected H264/HWAccel=ON in --version output" >&2
            exit 1
          fi

      - name: Upload workflow artifacts (${{ matrix.distro_tag }})
        uses: actions/upload-artifact@v4
        with:
          name: winrdp-${{ matrix.distro_tag }}-deb
          path: |
            dist/*.deb

  verify-ubuntu-26-10:
    needs: build-deb
    runs-on: ubuntu-24.04
    container: ubuntu:26.10
    steps:
      - name: Download ubuntu26.04 .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: winrdp-ubuntu26.04-deb
          path: dist

      - name: Install and verify winrdp .deb on Ubuntu 26.10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          DEB_FILE="$(ls -1 dist/*ubuntu26.04*.deb | head -n 1)"
          apt-get update
          apt-get install -y --no-install-recommends "./$DEB_FILE" desktop-file-utils
          if ldd /usr/bin/winrdp | grep -q 'not found'; then
            ldd /usr/bin/winrdp
            exit 1
          fi
          for libname in libfreerdp3.so.3 libfreerdp-client3.so.3 libwinpr3.so.3; do
            resolved="$(ldd /usr/bin/winrdp | awk -v l="$libname" '$1 == l {print $3}')"
            resolved_real="$(realpath -m "$resolved")"
            if [[ "$resolved_real" != "/usr/lib/winrdp/lib/"* ]]; then
              echo "ERROR: $libname did not resolve to bundled dir: $resolved ($resolved_real)" >&2
              exit 1
            fi
          done
          desktop-file-validate /usr/share/applications/io.winrdp.Client.desktop
          VER_OUT="$(winrdp --version)"
          echo "$VER_OUT"
          [[ "$VER_OUT" == *"H264/HWAccel=ON"* ]]

  build-flatpak:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flatpak & flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Restore cached Flatpak builder state
        uses: actions/cache@v4
        with:
          path: third_party/flatpak-builder-state
          key: flatpak-winrdp-3.33.1-${{ hashFiles('flatpak/io.winrdp.Client.yml') }}

      - name: Build single-file Flatpak bundle
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            PKG_VERSION="${GITHUB_REF_NAME#v}"
          else
            PKG_VERSION="$(sed -nE 's/^[[:space:]]*project\(winrdp[[:space:]]+VERSION[[:space:]]+([^[:space:])]+).*/\1/p' CMakeLists.txt | head -n 1)"
          fi
          ./scripts/build-flatpak.sh --version "$PKG_VERSION"

      - name: Verify Flatpak bundle
        run: |
          BUNDLE_FILE="$(ls -1 dist/*.flatpak | head -n 1)"
          flatpak install --user -y --noninteractive "$BUNDLE_FILE"
          VER_OUT="$(flatpak run io.winrdp.Client --version)"
          echo "$VER_OUT"
          [[ "$VER_OUT" == *"H264/HWAccel=ON"* ]]

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: winrdp-flatpak
          path: |
            dist/*.flatpak

  publish-release:
    needs: [build-deb, verify-ubuntu-26-10, build-flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download ubuntu24.04 .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: winrdp-ubuntu24.04-deb
          path: dist

      - name: Download ubuntu26.04 .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: winrdp-ubuntu26.04-deb
          path: dist

      - name: Download Flatpak bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: winrdp-flatpak
          path: dist

      - name: Compute combined SHA256SUMS.txt
        run: |
          (cd dist && sha256sum winrdp_*.flatpak winrdp_*.deb | tee SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.flatpak dist/*.deb dist/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.flatpak dist/*.deb dist/SHA256SUMS.txt \
              --title "WinRDP $GITHUB_REF_NAME" \
              --generate-notes
          fi
